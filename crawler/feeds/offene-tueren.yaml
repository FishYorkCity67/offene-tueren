search_topics:
  - "Tag der offenen Tür Gymnasium {city} {month}"
  - "Tag der offenen Tür Schule {city} {year}"
  - "Hochschulinformationstag Schnupperstudium {city} {year}"
  - "Ausbildungsmesse {city} {year} Schüler"
  - "Tag der offenen Tür Feuerwehr Polizei Rathaus {city} {year}"
  - "Tag der offenen Tür Museum Forschungsinstitut {city} {year}"
  - "Betriebsbesichtigung Tag der offenen Tür Unternehmen Ausbildung {city} {year}"

# Nie abrufen: soziale Netzwerke, Ticketportale und Portale, deren Nutzungsbedingungen
# das automatische Übernehmen verbieten (meinestadt.de, festivalsindeutschland.de).
blocked_domains: &blocked
  - facebook.com
  - instagram.com
  - x.com
  - twitter.com
  - tiktok.com
  - linkedin.com
  - xing.com
  - youtube.com
  - eventbrite.de
  - eventbrite.com
  - meetup.com
  - google.com
  - google.de
  - eventim.de
  - meinestadt.de
  - festivalsindeutschland.de

manual: []
