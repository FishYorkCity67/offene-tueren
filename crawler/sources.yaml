# Feste Quellen für den Crawler.
#
# Hier nur öffentliche Seiten eintragen, deren Nutzungsbedingungen das automatische Lesen erlauben.
# robots.txt prüft der Crawler selbst – was dort verboten ist, wird nie abgerufen.
#
#   url:       Seite, iCal-Datei (.ics) oder PDF
#   category:  hochschule | schule | ausbildung | sonstiges  (optional – sonst errät der Crawler sie)
#   follow:    wie viele Links mit passenden Stichwörtern („Tag der offenen Tür“, „Infotag“ …)
#              von dieser Seite aus zusätzlich gelesen werden (0 = keine)
#   same_host: Links nur auf derselben Website folgen (Standard: ja)
#   link_pattern: (optional) regulärer Ausdruck für die Adressen der Links, denen gefolgt wird –
#              nützlich bei Übersichtsseiten, deren Links keine Stichwörter enthalten

