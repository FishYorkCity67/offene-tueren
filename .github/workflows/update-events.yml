# Sammelt jeden Morgen neue Termine und speichert data/events.json im Repository.
# Die App lädt diese Datei über die "Raw"-Adresse:
#   https://raw.githubusercontent.com/<DEIN-NAME>/<REPO>/main/data/events.json
name: Termine aktualisieren

on:
  schedule:
    - cron: "17 4 * * *"      # täglich ca. 5:17 Uhr deutscher Zeit (GitHub rechnet in UTC)
  workflow_dispatch: {}        # "Run workflow"-Knopf zum Starten von Hand

permissions:
  contents: write              # damit die Action events.json zurückschreiben darf

concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/requirements.txt

      - name: Pakete installieren
        run: pip install -r crawler/requirements.txt

      - name: Termine sammeln
        env:
          # Optional: Claude-API-Schlüssel als Repository-Secret "ANTHROPIC_API_KEY" anlegen.
          # Ohne Schlüssel läuft der Crawler trotzdem (strukturierte Daten + Text-Erkennung).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Modell für die KI-Auswertung. claude-haiku-5-5 kostet nur einen Bruchteil.
          LLM_MODEL: claude-opus-5-5
          MAX_LLM_PAGES: "40"      # höchstens so viele Seiten pro Tag von der KI lesen lassen
          SEARCH_QUERIES: "8"      # so viele Websuchen pro Tag (nur mit Schlüssel)
          MAX_PAGES: "400"
        run: python crawler/crawl.py

      - name: Ergebnis prüfen
        run: python crawler/summary.py data/events.json | head -n 5

      - name: Änderungen speichern
        run: |
          git config user.name "termine-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/geocache.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Termine aktualisiert ($(date -u +%Y-%m-%d))"
            git push
          fi
